# Render Blueprint: one Node web service serving the API and the built React app.
# Database: Neon Postgres (external). Paste its connection string into the Render dashboard
# as DATABASE_URL — it is intentionally NOT stored in this repo.
services:
  - type: web
    name: upskill
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install --prefix server --omit=dev && npm install --prefix client --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # set in the Render dashboard (Neon connection string)
      - key: JWT_SECRET
        generateValue: true    # random 32+ char secret generated by Render
      - key: ENABLE_DEMO_TOOLS
        value: "false"         # set to "true" only for a live demo of billing-period fast-forward
      # Grafana Cloud observability (OTLP). Telemetry is disabled until the endpoint is set.
      - key: OTEL_SERVICE_NAME
        value: upskill
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false            # https://otlp-gateway-<region>.grafana.net/otlp
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false            # Authorization=Basic <base64(instanceId:token)> - secret, set in the dashboard/API
      # Slack notifications (the Incoming Webhook URL is a secret: set it in the dashboard/API)
      - key: UPSKILL_SLACK_BOT_TOKEN
        sync: false            # xoxb- bot token (secret): set in the dashboard/API
      - key: UPSKILL_SLACK_CHANNEL
        value: C0CKUACMZ18     # #upskill-enggteam (the bot must be invited to it)
      - key: SLACK_ENV_LABEL
        value: production
